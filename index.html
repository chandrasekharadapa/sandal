<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANDAL - Your AI Search Companion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .glow-line {
            position: absolute;
            width: 150%;
            height: 150%;
            border: 2px solid rgba(255, 102, 0, 0.15);
            border-radius: 50%;
            top: -50%;
            left: -20%;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.1);
        }

        sidebar {
            width: 70px;
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0;
            border-right: 1px solid #222;
            z-index: 10;
        }

        .sidebar-top, .sidebar-bottom {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .sidebar-icon {
            color: #888;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
            padding: 10px;
            border-radius: 10px;
        }

        .sidebar-icon:hover, .sidebar-icon.active {
            color: #ff6600;
            background-color: rgba(255, 102, 0, 0.1);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
        }

        .header-actions {
            display: flex;
            gap: 25px;
        }

        .header-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: 0.3s;
        }

        .header-btn:hover {
            color: #ff6600;
        }

        .center-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding-bottom: 50px;
        }

        .hero-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            color: white;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.6);
            margin-bottom: -5px;
        }

        .hero-title {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 3px;
            color: #ffffff;
        }

        .hero-subtitle {
            font-size: 14px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .search-box {
            position: relative;
            width: 600px;
            max-width: 90%;
        }

        .search-input {
            width: 100%;
            padding: 16px 120px 16px 50px;
            background-color: #141414;
            border: 1px solid #333;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            outline: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
        }

        .search-input:focus {
            border-color: #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
        }

        .search-icon-left {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .search-actions-right {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .mic-btn, .submit-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #888;
            transition: 0.3s;
        }

        .mic-btn:hover {
            color: #ff6600;
        }

        .submit-btn {
            width: 32px;
            height: 32px;
            background-color: #ff6600;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .submit-btn:hover {
            background-color: #e55b00;
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        .search-tags {
            display: flex;
            gap: 15px;
            font-size: 13px;
            color: #777;
        }

        .search-tags span {
            cursor: pointer;
            transition: 0.3s;
        }

        .search-tags span:hover {
            color: #ff6600;
        }

        .voice-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .voice-waves {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .voice-waves.active-wave {
            opacity: 1;
        }

        .wave {
            width: 3px;
            background-color: #ff6600;
            border-radius: 2px;
            animation: none;
        }

        .active-wave .wave {
            animation: pulseWave 1.2s infinite ease-in-out;
        }

        .wave:nth-child(1) { height: 10px; animation-delay: 0.1s; }
        .wave:nth-child(2) { height: 20px; animation-delay: 0.2s; }
        .wave:nth-child(3) { height: 35px; animation-delay: 0.3s; }
        .wave:nth-child(4) { height: 20px; animation-delay: 0.4s; }
        .wave:nth-child(5) { height: 12px; animation-delay: 0.5s; }

        @keyframes pulseWave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1.2); opacity: 1; }
        }

        .main-mic-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ff6600, #ff3300);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .main-mic-btn:hover {
            transform: scale(1.1);
        }

        .voice-text {
            font-size: 12px;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background: #161616;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #333;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
            position: relative;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #ff6600;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: white;
            border-radius: 5px;
        }

        .close-modal-btn {
            padding: 8px 20px;
            background: #ff6600;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        .trash-icon-btn {
            background: none;
            border: none;
            color: #ff4444;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .trash-icon-btn:hover {
            color: #ff0000;
            transform: scale(1.1);
        }

        .search-results-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b0b0b;
            z-index: 50;
            padding: 40px;
            overflow-y: auto;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
        }

        .cross-close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            transition: 0.3s;
        }

        .cross-close-btn:hover {
            color: #ff6600;
        }

        .results-content p {
            color: #ccc;
            font-size: 18px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="bg-glow">
        <div class="glow-line"></div>
    </div>

    <sidebar>
        <div class="sidebar-top">
            <div class="sidebar-icon active" title="Home" onclick="handleNav('Home')">🏠</div>
            <div class="sidebar-icon" title="Voice Search" onclick="triggerVoice()">🎙️</div>
            <div class="sidebar-icon" title="History" onclick="openModal('History')">🕒</div>
        </div>
        <div class="sidebar-bottom">
            <div class="sidebar-icon" title="Settings" onclick="openModal('Settings')">⚙️</div>
        </div>
    </sidebar>

    <div class="main-container">
        <header>
            <div class="logo-container">
                <div class="logo-icon">S</div>
                <div class="logo-text">SANDAL</div>
            </div>
            <div class="header-actions">
                <button class="header-btn" onclick="openModal('History')">🕒 History</button>
                <button class="header-btn" onclick="openModal('Login')">👤 Login</button>
            </div>
        </header>

        <div class="center-content">
            <div class="hero-logo">S</div>
            <div class="hero-title">SANDAL</div>
            <div class="hero-subtitle">Your AI Search Companion</div>

            <div class="search-box">
                <span class="search-icon-left">🔍</span>
                <input type="text" id="searchInput" class="search-input" placeholder="Search anything..." onkeypress="handleSearch(event)">
                <div class="search-actions-right">
                    <button class="mic-btn" onclick="triggerVoice()" title="Voice Search">🎙️</button>
                    <button class="submit-btn" onclick="performSearch()" title="Submit">➔</button>
                </div>
            </div>

            <div class="search-tags">
                <span onclick="setQuery('Ask')">Ask</span> &bull; 
                <span onclick="setQuery('Search')">Search</span> &bull; 
                <span onclick="setQuery('Get Answers')">Get Answers</span>
            </div>

            <div class="voice-section">
                <div class="voice-waves" id="voiceWaves">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                </div>
                <button class="main-mic-btn" onclick="triggerVoice()">🎙️</button>
                <div class="voice-text" id="voiceStatus">Tap to speak</div>
            </div>
        </div>
    </div>

    <div class="search-results-overlay" id="searchResultsView">
        <div class="results-header">
            <h2 style="color: #ff6600;">SANDAL AI Results</h2>
            <button class="cross-close-btn" onclick="closeSearchResults()" title="Close">✕</button>
        </div>
        <div class="results-content" id="resultsBody"></div>
    </div>

    <div class="modal" id="customModal">
        <div class="modal-content" id="modalContentBox">
            <h3 id="modalTitle">Modal Title</h3>
            <div id="modalBody">Content goes here...</div>
            <br>
            <button class="close-modal-btn" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if(query !== "") {
                let history = JSON.parse(localStorage.getItem('sandal_history')) || [];
                if(!history.includes(query)) {
                    history.unshift(query);
                    localStorage.setItem('sandal_history', JSON.stringify(history));
                }

                const resultsView = document.getElementById('searchResultsView');
                const resultsBody = document.getElementById('resultsBody');
                
                resultsView.style.display = 'block';
                resultsBody.innerHTML = `<h3>Results for: <span style="color:#ff6600;">"${query}"</span></h3>
                                         <p>AI is processing your query...</p>
                                         <br><div style="background:#161616; padding:20px; border-radius:10px; border:1px solid #333;">
                                         <p><b>Answer:</b> AI generated analysis for "${query}" is successfully loaded here.</p></div>`;
            } else {
                alert("Please type or speak something to search!");
            }
        }

        function closeSearchResults() {
            document.getElementById('searchResultsView').style.display = 'none';
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                performSearch();
            }
        }

        function setQuery(type) {
            const input = document.getElementById('searchInput');
            input.value = type + " ";
            input.focus();
        }

        function triggerVoice() {
            const status = document.getElementById('voiceStatus');
            const waves = document.getElementById('voiceWaves');
            
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                status.innerText = "Speech recognition not supported in this browser.";
                alert("Please use Kiwi Browser or Chrome with microphone permissions enabled.");
                return;
            }

            waves.classList.add('active-wave');
            status.innerText = "Listening... Speak now...";
            
            try {
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                recognition.interimResults = false;
                recognition.maxAlternatives = 1;
                
                recognition.onresult = function(event) {
                    const speechText = event.results[0][0].transcript;
                    document.getElementById('searchInput').value = speechText;
                    stopVoiceAnimation();
                    status.innerText = "Ready! Now click arrow to search.";
                };
                
                recognition.onerror = function(event) {
                    stopVoiceAnimation();
                    status.innerText = "Mic error: Check permissions.";
                };

                recognition.onend = function() {
                    stopVoiceAnimation();
                };

                recognition.start();
            } catch (error) {
                stopVoiceAnimation();
                status.innerText = "Microphone failed to start.";
            }
        }

        function stopVoiceAnimation() {
            const waves = document.getElementById('voiceWaves');
            waves.classList.remove('active-wave');
        }

        function openModal(type) {
            const modal = document.getElementById('customModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            modal.style.display = 'flex';
            title.innerText = type;

            if(type === 'Login') {
                body.innerHTML = `<input type="email" placeholder="Enter Email"><input type="password" placeholder="Password"><br><button class="close-modal-btn" onclick="alert('Logged in successfully!'); closeModal();" style="margin:0;">Login</button>`;
            } else if(type === 'History') {
                let history = JSON.parse(localStorage.getItem('sandal_history')) || [];
                
                title.innerHTML = `History <button class="trash-icon-btn" onclick="clearHistory()" title="Clear History">🗑️</button>`;

                if(history.length === 0) {
                    body.innerHTML = `<p style="color: #777;">No search history found.</p>`;
                } else {
                    let listHTML = `<ul style="text-align: left; list-style: none; padding: 0; max-height: 200px; overflow-y: auto;">`;
                    history.forEach(item => {
                        listHTML += `<li style="padding: 8px 0; border-bottom: 1px solid #222; color: #ccc;">
                                        🔍 ${item}
                                     </li>`;
                    });
                    listHTML += `</ul>`;
                    body.innerHTML = listHTML;
                }
            } else {
                title.innerText = type;
                body.innerHTML = `<p style="color: #aaa;">Settings options will appear here.</p>`;
            }
        }

        function clearHistory() {
            localStorage.removeItem('sandal_history');
            openModal('History');
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function handleNav(name) {
            alert(name + " clicked!");
        }
    </script>
</body>
</html>
